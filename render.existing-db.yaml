# Deploy this Blueprint in My Workspace using the existing opportunityos-db.
# Render resolves DATABASE_URL internally; no credentials belong in this file.
services:
  - type: web
    name: opportunityos-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_PREFIX
        value: ""
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: opportunityos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: '["https://opportunityos-omega.vercel.app"]'
      - key: LOG_LEVEL
        value: INFO
